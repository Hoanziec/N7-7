<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenSort - Báo cáo</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="logo" href="index.html">Green<span>Sort</span></a><button class="menu" onclick="toggle()">☰</button><nav><a href="index.html">Trang chủ</a><a href="guide.html">Hướng dẫn</a><a href="recognize.html">Nhận diện</a><a href="report.html">Báo cáo</a><a href="stats.html">Thống kê</a></nav></div></header><main class="container page"><button class="back" onclick="history.back()">← Quay lại</button><div class="title"><h1>Phần 3 – Báo cáo</h1><p>Gửi thông tin về rác cần được phân loại hoặc xử lý.</p></div><div class="form"><label>Loại rác<select id="type"></select></label><label>Khu vực<input id="area" placeholder="Ví dụ: Quận 1"></label><label>Mô tả<textarea id="desc" placeholder="Mô tả tình trạng rác..."></textarea></label><button class="btn" onclick="sendReport()">Gửi báo cáo</button></div><h2>Danh sách báo cáo đã gửi</h2><div class="table-wrap"><table><thead><tr><th>Loại</th><th>Khu vực</th><th>Mô tả</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody id="reports"></tbody></table></div></main><footer>GreenSort</footer><script src="app.js"></script><script>const s=document.getElementById('type');wasteData.forEach(x=>s.innerHTML+='<option>'+x.en+'</option>');function sendReport(){const a=area.value.trim(),d=desc.value.trim();if(!a||!d){alert('Vui lòng nhập khu vực và mô tả.');return}let r=JSON.parse(localStorage.getItem('gsReports')||'[]');r.unshift({t:s.value,a,d,time:new Date().toLocaleString('vi-VN')});localStorage.setItem('gsReports',JSON.stringify(r));render();area.value='';desc.value='';alert('Đã gửi báo cáo.')}function render(){let r=JSON.parse(localStorage.getItem('gsReports')||'[]');reports.innerHTML=r.length?r.map(x=>'<tr><td>'+x.t+'</td><td>'+x.a+'</td><td>'+x.d+'</td><td>'+x.time+'</td><td>Mới</td></tr>').join(''):'<tr><td colspan="5" class="empty">Chưa có báo cáo nào.</td></tr>'}render();</script></body></html>
