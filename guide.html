<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenSort - Hướng dẫn</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="logo" href="index.html">Green<span>Sort</span></a><button class="menu" onclick="toggle()">☰</button><nav><a href="index.html">Trang chủ</a><a href="guide.html">Hướng dẫn</a><a href="recognize.html">Nhận diện</a><a href="report.html">Báo cáo</a><a href="stats.html">Thống kê</a></nav></div></header><main class="container page"><button class="back" onclick="history.back()">← Quay lại</button><div class="title"><h1>Phần 1 – Hướng dẫn phân loại rác</h1><p>Bấm vào từng loại rác để xem thông tin chi tiết.</p></div><div id="guideGrid" class="cards"></div><div id="detail" class="detail" hidden></div></main><footer>GreenSort</footer><script src="app.js"></script><script>const grid=document.getElementById('guideGrid'),detail=document.getElementById('detail');wasteData.forEach(x=>{let b=document.createElement('button');b.className='card clickable';b.innerHTML='<div class="waste-icon">'+x.icon+'</div><h3>'+x.vi+'</h3><p>'+x.en+'</p>';b.onclick=()=>{detail.hidden=false;detail.innerHTML='<button class="close" onclick="detail.hidden=true">Đóng</button><h2>'+x.vi+' ('+x.en+')</h2><p><b>Đặc điểm:</b> '+x.feature+'</p><p><b>Ví dụ:</b> '+x.examples+'</p><p><b>Cách xử lý:</b> '+x.process+'</p>';detail.scrollIntoView({behavior:'smooth',block:'center'})};grid.appendChild(b)});</script></body></html>
